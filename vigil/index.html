<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)">
<title>vigil</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --ink: #17181a;
  --sub: #45484e;
  --muted: #9aa0a8;
  --sans: "Familjen Grotesk", Helvetica, Arial, sans-serif;
  --mono: "Spline Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1013;
    --ink: #e9e7e2;
    --sub: #a9a8a2;
    --muted: #6f7076;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.55;
}
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
::selection { background: var(--ink); color: var(--bg); }

.screen {
  max-width: 620px;
  margin: 0 auto;
  padding: clamp(3.5rem, 15vh, 11rem) 1.5rem 6rem;
}
.brand {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .24em;
  text-transform: uppercase; color: var(--muted); margin: 0 0 2rem;
}
.days { list-style: none; margin: 0; padding: 0; }
.days a {
  display: block; padding: .6rem 0;
  font-size: 1.05rem; line-height: 1.5; font-weight: 500;
}
.days a:hover { color: var(--sub); }
</style>
</head>
<body>

<section class="screen">
  <p class="brand">vigil</p>
  <ol class="days">
  </ol>
</section>

</body>
</html>
