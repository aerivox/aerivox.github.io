name: publish to main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: publish-to-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forward this branch to main, then delete it
        run: |
          git push origin HEAD:main || (git fetch origin main && git rebase origin/main && git push origin HEAD:main)
          git push origin --delete "${GITHUB_REF_NAME}"
